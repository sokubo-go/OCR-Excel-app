<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイムカードOCR変換</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>タイムカード OCR 変換</h1>
            <p class="subtitle">タイムカードの写真をアップロードまたは撮影して、AI-OCRでExcelに変換します</p>
        </header>

        <main>
            <!-- アップロードエリア -->
            <div id="dropZone" class="drop-zone">
                <div class="drop-zone-content">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <p>ここにタイムカード画像をドラッグ&ドロップ</p>
                    <p class="drop-zone-hint">または</p>
                    <div class="upload-buttons">
                        <button type="button" id="selectBtn" class="btn btn-secondary">ファイルを選択</button>
                        <button type="button" id="cameraBtn" class="btn btn-camera">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                                <circle cx="12" cy="13" r="4"/>
                            </svg>
                            カメラで撮影
                        </button>
                    </div>
                    <p class="drop-zone-hint">JPG, PNG, WebP対応 / 複数枚OK</p>
                </div>
                <input type="file" id="fileInput" multiple accept="image/jpeg,image/png,image/gif,image/webp" hidden>
                <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
            </div>

            <!-- プレビューエリア -->
            <div id="previewArea" class="preview-area" hidden>
                <div class="preview-header">
                    <h2>アップロード画像 (<span id="fileCount">0</span>枚)</h2>
                    <div class="preview-actions">
                        <label class="select-all-label">
                            <input type="checkbox" id="selectAllCb" checked>
                            すべて選択
                        </label>
                        <button type="button" id="clearBtn" class="btn btn-text">すべてクリア</button>
                    </div>
                </div>
                <div id="previewGrid" class="preview-grid"></div>
            </div>

            <!-- 変換ボタン -->
            <div id="actionArea" class="action-area" hidden>
                <button type="button" id="convertBtn" class="btn btn-primary">
                    選択した画像を Excel に変換
                </button>
            </div>

            <!-- 進捗表示 -->
            <div id="progressArea" class="progress-area" hidden>
                <div class="spinner"></div>
                <p id="progressText">AI-OCRで読み取り中...</p>
            </div>

            <!-- エラー表示 -->
            <div id="errorArea" class="error-area" hidden>
                <p id="errorText"></p>
                <button type="button" id="retryBtn" class="btn btn-secondary">やり直す</button>
            </div>

            <!-- 変換結果エリア -->
            <div id="resultsArea" class="results-area" hidden>
                <div class="results-header">
                    <h2>変換結果</h2>
                    <p class="results-hint">ダウンロードするファイルを選択してください</p>
                </div>
                <div id="resultsList" class="results-list"></div>
                <div class="results-actions">
                    <button type="button" id="mergeBtn" class="btn btn-primary" hidden>
                        選択したファイルをマージして出力
                    </button>
                    <button type="button" id="newBtn" class="btn btn-secondary">新しいファイルを変換</button>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
